<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="same-origin" />
    <title>WolfWatch Admin Login</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0a0a0c;
        color: #f4f4f5;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: radial-gradient(circle at 30% 20%, #16161b, #0a0a0c 70%);
      }
      main {
        width: min(360px, 100%);
        padding: 32px;
        border: 1px solid #303038;
        border-radius: 12px;
        background: #16161b;
        box-shadow: 0 24px 80px #0009;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 1.4rem;
        text-align: center;
        text-transform: uppercase;
      }
      label {
        display: block;
        margin: 16px 0 8px;
        color: #aaaab5;
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 6px;
        font: inherit;
      }
      input {
        padding: 12px;
        border: 1px solid #383841;
        background: #101014;
        color: inherit;
      }
      button {
        margin-top: 22px;
        padding: 12px;
        border: 0;
        background: #f4f4f5;
        color: #101014;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      #error {
        min-height: 1.25em;
        margin: 14px 0 0;
        color: #ff7777;
        font-size: 0.875rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WolfWatch Admin</h1>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p id="error" role="alert" aria-live="polite"></p>
        <button id="submit" type="submit">Log in</button>
      </form>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const errorMessage = document.getElementById("error");
      const submitButton = document.getElementById("submit");

      async function redirectIfLoggedIn() {
        try {
          const response = await fetch("/api/me");
          if (response.ok && (await response.json()).loggedIn) {
            window.location.replace("/admin-lino.html");
          }
        } catch (error) {
          console.error("Could not check the admin session:", error);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMessage.textContent = "";
        submitButton.disabled = true;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: form.elements.username.value,
              password: form.elements.password.value,
            }),
          });
          if (!response.ok) {
            const result = await response.json();
            throw new Error(result.error || "Login failed.");
          }
          window.location.assign("/admin-lino.html");
        } catch (error) {
          errorMessage.textContent =
            error instanceof Error ? error.message : "Unable to log in. Please try again.";
          submitButton.disabled = false;
        }
      });

      redirectIfLoggedIn();
    </script>
  </body>
</html>
